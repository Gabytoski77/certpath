# Publishes mynextcert.com. The full CI already passed on the PR (and main must be up to date before merging),
# so this only re-checks that index.html matches src/ (cheap) and publishes. Saves Actions minutes.
# Needs: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:     # "Run workflow" button: re-deploy main by hand (e.g. after a rollback)

permissions:
  contents: read

# one deploy at a time; a newer push waits instead of cancelling a deploy halfway through
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write             # publish to Pages
      id-token: write          # prove to Pages that this run is from this repo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: index.html is exactly what src/ builds (a failure stops the deploy)
        run: python3 build/build_site.py --check
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Copy only the public site files
        run: python3 build/stage_site.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # keep /.well-known/security.txt
          # one artifact name per attempt: a manual "Re-run" otherwise finds the first attempt's artifact
          # with the same name and fails, so a failed Deploy could never be re-run (v2.70)
          name: github-pages-${{ github.run_attempt }}
      # Nov 19, 2026: deploy-pages once looked for the artifact 0.4 s after upload, found 0 and failed
      # ("Fetching artifact metadata failed"), so v2.66 didn't publish. If that happens, wait and try once more.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before retrying the publish
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
