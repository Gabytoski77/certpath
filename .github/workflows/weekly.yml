# Every Monday: broken links, certificate expiry (Cloudflare + GitHub origin), library versions, OWASP ZAP baseline.
# Any failure opens (or updates) one issue so it shows up in your GitHub notifications.
name: Weekly

on:
  schedule:
    - cron: "17 16 * * 1"   # Mondays 16:17 UTC = 8:17 AM Pacific (winter)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Broken links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy the guides' links out of the app's JavaScript (most links live there)
        run: python3 build/extract_scripts.py "$RUNNER_TEMP/js"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 403/429: many vendor sites block robots but work in a browser, so those count as OK
          args: >-
            --no-progress --max-concurrency 8 --max-retries 3 --timeout 30
            --accept 200..=299,403,429
            --exclude-all-private
            --exclude "^https?://(www\.)?example\.(com|org|net)"
            --exclude "^https?://(192\.0\.2|198\.51\.100|203\.0\.113)\."
            --exclude "^https://www\.cool\.osd\.mil/"
            --root-dir ${{ github.workspace }}
            index.html 404.html ${{ runner.temp }}/js/inline-2.js
          fail: true
          jobSummary: true
      # The DoD site's certificate isn't trusted by the runner ("SSL certificate not trusted"), so the CG COOL links
      # get their own small check that skips the certificate test. They still have to answer, so a dead page still fails.
      - name: Pull out the CG COOL links
        if: always()
        run: grep -ohE 'https://www\.cool\.osd\.mil/[^"'"'"' <>)]*' index.html "$RUNNER_TEMP/js/inline-2.js" | sort -u > "$RUNNER_TEMP/cool-links.txt"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        if: always()
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30 --insecure
            --accept 200..=299,403,429
            ${{ runner.temp }}/cool-links.txt
          fail: true
          jobSummary: true

  health:
    name: Certificates and libraries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 build/weekly_report.py

  zap:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write            # ZAP keeps one issue up to date with what it found
      actions: read            # ZAP reads the last run's report to compare; without it, it opens a new issue every run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://mynextcert.com/
          rules_file_name: .github/zap-rules.tsv
          cmd_options: -a -j -m 3
          issue_title: "ZAP baseline scan of mynextcert.com"
          allow_issue_writing: true
          fail_action: false   # findings go to the issue for review; they don't mark the deploy as failed

  alert:
    name: Open an issue if anything failed
    needs: [links, health, zap]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "Weekly MyNextCert check failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: "open"});
            const same = open.data.find(i => i.title === title);
            if (same) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo,
                issue_number: same.number, body: "Failed again: " + run});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title,
                body: "Broken links or a certificate close to expiry. Details (see the job summary): " + run});
            }
